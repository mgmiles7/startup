<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Us CSS</title>
        <link rel ="icon" href="fav.ico"/>
        <link 
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
            rel="stylesheet" 
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="main.css"/>
        

    </head>
<body>
    <header>
        <!-- <h1>Us</h1> -->
        <img src="logo.png" alt="Us logo" id="logo">
    </header>
    <main>
        <h2>Sign in</h2>
        <form method="get" action="chat.html">
            <div class="input-group">
                <span class="input-group-text" id="visible-addon">👋</span>
                <input type="text" class="form-control" placeholder="username" aria-label="username" aria-describedby="visible-addon">
            </div>
            <div class="input-group">
                <span class="input-group-text" id="visible-addon">🔒</span>
                <input type="text" class="form-control" placeholder="password" aria-label="password" aria-describedby="visible-addon">
            </div>
            <div id="buttons">
            <button type="submit" class="btn btn-primary">Login</button>
            <button type="submit" class="btn btn-primary">Create Account</button>
            </div>
        </form>
    </main>
    <footer>
        <hr>
        <p>Morgan Miles | <a href="https://github.com/mgmiles7/startup" style="color: rgb(232, 106, 127); text-decoration: none;" >GitHub</a> </p>
    </footer>
</body>
</html>
